<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#176b63" />
    <title>연결 확인 · 지구 한 바퀴</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f3ed;
        color: #223e42;
        font-family: system-ui, sans-serif;
      }
      main {
        text-align: center;
        max-width: 420px;
        padding: 28px;
      }
      img {
        width: 150px;
        height: 150px;
      }
      p {
        line-height: 1.8;
      }
      a {
        display: inline-block;
        padding: 14px 24px;
        border-radius: 12px;
        background: #176b63;
        color: white;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>잠시 연결을 확인해 주세요</h1>
      <p>여행 기록을 불러오고 저장하려면 인터넷이 필요해요. 연결한 뒤 다시 열어 주세요.</p>
      <a href="/">다시 연결하기</a>
    </main>
  </body>
</html>
